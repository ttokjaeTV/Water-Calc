name: 데이터 갱신 및 배포

# 데이터는 git 에 커밋하지 않고 Pages 아티팩트로 바로 올린다.
# 전종목 지표가 매일 수 MB씩 쌓이면 1년 만에 레포가 수 GB로 불어나기 때문이다.
# 대신 캐시에 넣어두고, 매크로만 갱신하는 실행에서는 그 캐시를 재사용한다.

on:
  # 코드를 고쳐 푸시하면 바로 반영돼야 한다. 다만 전종목 수집을 매번 다시 할
  # 이유는 없으므로, 푸시 때는 캐시된 데이터를 그대로 얹어 배포만 다시 한다.
  push:
    branches: [master, main]
    paths-ignore:
      - 'README.md'
      - 'legacy/**'
      - '.gitignore'
  schedule:
    # 한국시간 07:00 (UTC 22:00) — 미국장 마감 후, 국내장 개장 전. 전체 갱신.
    - cron: '0 22 * * 1-5'
    # 매크로만 — 한국시간 10:00 / 16:00 / 22:00
    - cron: '0 1,7,13 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '갱신 범위 (deploy = 수집 없이 배포만)'
        type: choice
        default: full
        options: [full, macro, deploy]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 외국인 순매수는 KRX 로그인이 필요하고, 로그인은 pykrx 가 처리한다.
      # 이 항목 하나 때문에 전체가 멈추면 안 되므로 설치 실패도 넘긴다.
      - name: pykrx 설치
        run: pip install --quiet pykrx || echo "pykrx 설치 실패 — KRX 항목은 건너뛴다"

      - name: 갱신 범위 결정
        id: mode
        run: |
          case "${{ github.event_name }}" in
            workflow_dispatch) M="${{ inputs.mode }}" ;;
            push)              M="deploy" ;;
            schedule)
              if [ "${{ github.event.schedule }}" = "0 22 * * 1-5" ]; then
                M="full"
              else
                M="macro"
              fi ;;
            *)                 M="macro" ;;
          esac
          echo "mode=$M" >> $GITHUB_OUTPUT
          echo "이번 실행 범위: $M"

      - name: 엔진 버전 (캐시 무효화용)
        id: eng
        run: echo "h=${{ hashFiles('scripts/indicators.py') }}" >> $GITHUB_OUTPUT

      # 캐시 키에 엔진 해시를 넣는다. indicators.py 를 고치면 캐시가 미스나고,
      # 옛 형식으로 계산된 데이터를 그대로 얹어 배포하는 사고를 막는다.
      - name: 직전 데이터 복원
        uses: actions/cache/restore@v4
        with:
          path: data
          key: waterdata-${{ steps.eng.outputs.h }}-
          restore-keys: waterdata-${{ steps.eng.outputs.h }}-

      - name: 미국 전종목 보조지표
        if: steps.mode.outputs.mode == 'full'
        run: python scripts/build_us_indicators.py
        env:
          WORKERS: '10'

      - name: 국내 전종목 보조지표
        if: steps.mode.outputs.mode == 'full'
        run: python scripts/build_kr_indicators.py
        env:
          WORKERS: '8'

      # 매크로는 어떤 모드에서든 항상 새로 만든다.
      # 1분이면 끝나는데 조건을 걸었더니, 캐시에 옛 macro.json 이 남아 있으면
      # 새 항목(외국인 순매수 등)이 영영 안 채워지고 사람이 수동으로
      # macro 모드를 한 번 더 돌려야 하는 상황이 생겼다. 그럴 이유가 없다.
      #
      # KRX_ID / KRX_PW 는 레포 Settings > Secrets and variables > Actions 에 등록한다.
      # 없으면 외국인 순매수만 null 로 남고 나머지는 정상 수집된다.
      - name: 매크로·버블 지표
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python scripts/build_macro.py

      # 엔진을 고쳤거나 캐시가 만료되면 여기로 온다. 일부만 새 형식이면
      # 화면이 반쪽이 되므로 축소하지 않고 전종목을 다시 만든다.
      - name: 캐시가 비었으면 전종목 재계산
        if: steps.mode.outputs.mode == 'deploy' && hashFiles('data/kr/*.json') == ''
        run: |
          echo "캐시 없음 (엔진 변경 또는 만료) — 전종목을 다시 계산한다."
          python scripts/build_kr_indicators.py
          python scripts/build_us_indicators.py
        env:
          WORKERS: '10'

      # 매크로 5년 시계열. 소스가 무거워 매크로와 분리하고,
      # 실패해도 전체를 세우지 않는다 (차트만 안 보일 뿐이다).
      - name: 매크로 5년 시계열
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python scripts/build_history.py || echo "시계열 생성 실패 — 차트는 생략된다"

      - name: 산출물 점검
        run: |
          ls -la data/ || true
          python scripts/verify_outputs.py

      - name: 데이터 캐시 저장
        uses: actions/cache/save@v4
        with:
          path: data
          key: waterdata-${{ steps.eng.outputs.h }}-${{ github.run_id }}

      - name: 사이트 묶기
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r data _site/
          [ -d assets ] && cp -r assets _site/ || true
          echo "배포 크기: $(du -sh _site | cut -f1)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
